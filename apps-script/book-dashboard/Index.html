<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#0e0f11; --card:#17191c; --ink:#eceef0; --muted:#8b9096; --line:#262a2e;
          --red:#ff6b5e; --red-bg:#2a1715; --amber:#f2b44c; --amber-bg:#2a2112; --green:#4fd18b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 Manrope, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  .asof { color: var(--muted); font-size: 12px; }
  .strip { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .s { font-size: 11px; color: var(--muted); }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
  .card.red { border: 2px solid var(--red); background: var(--red-bg); }
  .card.amber { border: 2px dashed var(--amber); background: var(--amber-bg); }
  .card .name { font-weight: 600; display:flex; justify-content:space-between; gap:8px; }
  .tag { font-size: 12px; font-weight: 600; }
  .red .tag { color: var(--red); } .amber .tag { color: var(--amber); } .green .tag { color: var(--green); }
  .gap { font-size: 20px; font-weight: 700; color: var(--red); margin: 4px 0 2px; }
  .row { display:flex; justify-content:space-between; font-size: 13px; }
  .row span:first-child { color: var(--muted); }
  .note { font-size: 12px; margin-top: 6px; color: var(--muted); }
  .holder-sum { font-size: 13px; color: var(--muted); margin: -4px 0 8px; }
  button { margin-top: 18px; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  .hidden { display: none; }
  .tabs { display:flex; gap:6px; margin:14px 0 4px; }
  .tabs button { margin:0; padding:8px 16px; border-radius:20px; font-weight:600; }
  .tabs button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .card .total { border-top:1px solid var(--line); margin-top:5px; padding-top:5px; font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
  .chips button { margin:0; padding:5px 12px; border-radius:16px; }
  .chips button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .tbl { width:100%; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { padding:7px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  th:first-child, td:first-child { text-align:left; }
  tr.sel td { background:var(--card); }
  .warn { color:var(--amber); }
</style>
</head>
<body>
<main id="app"></main>
<script>
var M = <?!= modelJson ?>;

function money(x, cur) {
  var s = Math.abs(x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  var sign = x < 0 ? '−' : '';
  return cur === 'PHP' ? sign + '₱' + s : sign + s + ' ' + cur;
}
function signed(x, cur) { return (x > 0 ? '+' : '') + money(x, cur); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ago(d) { return d === 0 ? 'today' : d === 1 ? '1 day ago' : d + ' days ago'; }

function card(c) {
  var h = '<div class="card ' + c.status + '"><div class="name"><span>' + esc(c.account) + '</span>';
  if (c.status === 'red') {
    h += '<span class="tag">Gap</span></div><div class="gap">' + signed(c.check.gap, c.currency) + '</div>' +
      '<div class="row"><span>App</span><span>' + money(c.check.app, c.currency) + '</span></div>' +
      '<div class="row"><span>Expected at check</span><span>' + money(c.check.expectedAtCheck, c.currency) + '</span></div>' +
      '<div class="row"><span>Checked</span><span>' + ago(c.check.ageDays) + '</span></div>';
  } else if (c.status === 'amber') {
    h += '<span class="tag">' + (c.check ? 'Checked ' + ago(c.check.ageDays) : 'Never checked') + '</span></div>';
  } else {
    h += '<span class="tag">✓ ' + ago(c.check.ageDays) + '</span></div>';
  }
  h += '<div class="row"><span>Expected now</span><span>' + money(c.expected, c.currency) + '</span></div>';
  if (c.openTickets) h += '<div class="row"><span>Open (' + c.openTickets + ')</span><span>' + money(c.openStakes, c.currency) + '</span></div>';
  if (c.check && c.check.note) h += '<div class="note">' + esc(c.check.note) + '</div>';
  return h + '</div>';
}
function cards(list) { return '<div class="cards">' + list.map(card).join('') + '</div>'; }
function stat(k, v, s) { return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }

function sgn(x, cur) { return x === 0 ? money(0, cur) : '<span class="' + (x > 0 ? 'pos' : 'neg') + '">' + signed(x, cur) + '</span>'; }
function mcard(c) {
  var h = '<div class="card"><div class="name"><span>' + esc(c.account) + '</span><span>' + money(c.cash, c.currency) + '</span></div>';
  h += '<div class="row"><span>Deposits</span><span>' + money(c.deposits, c.currency) + '</span></div>';
  h += '<div class="row"><span>Withdrawals</span><span>' + money(c.withdrawals, c.currency) + '</span></div>';
  if (c.transfers) h += '<div class="row"><span>Transfers</span><span>' + sgn(c.transfers, c.currency) + '</span></div>';
  if (c.bonus) h += '<div class="row"><span>Bonus / adj.</span><span>' + sgn(c.bonus, c.currency) + '</span></div>';
  h += '<div class="row"><span>Betting result</span><span>' + sgn(c.result, c.currency) + '</span></div>';
  if (c.openStakes) h += '<div class="row"><span>Open stakes</span><span>' + money(-c.openStakes, c.currency) + '</span></div>';
  return h + '</div>';
}
function mcards(list) { return '<div class="cards">' + list.map(mcard).join('') + '</div>'; }
function show(t) {
  ['books', 'money', 'months'].forEach(function (p) {
    document.getElementById('p-' + p).classList.toggle('hidden', p !== t);
    document.getElementById('t-' + p).classList.toggle('on', p === t);
  });
}

var S = M.summary, h = '';
h += '<h1>Books</h1><div class="tabs"><button id="t-books" class="on" onclick="show(\'books\')">Books</button>' +
  '<button id="t-money" onclick="show(\'money\')">Money</button>' +
  '<button id="t-months" onclick="show(\'months\')">Months</button></div>';
h += '<div id="p-books"><div class="asof">Live from the sheet · opened ' + esc(M.opened) +
  (M.newestBet ? ' · newest ticket ' + esc(M.newestBet) : '') + (M.newestCheck ? ' · newest balance check ' + esc(M.newestCheck) : '') + '</div>';
h += '<div class="strip">' +
  stat('Cash in books', money(S.cash, 'PHP')) +
  stat('Open stakes', money(S.openStakes, 'PHP')) +
  stat('Max return', money(S.maxReturn, 'PHP'), 'ceiling if every open leg wins' + (S.maxReturnAt ? ' · ' + esc(S.maxReturnAt) : '')) +
  stat('Books matched', S.matched + ' of ' + S.total) +
  (M.crypto.length ? stat('Crypto', M.crypto.map(function (c) { return money(c.expected, c.currency); }).join('<br>')) : '') +
  '</div>';
h += '<h2>My books</h2>' + cards(M.own);
if (M.crypto.length) h += '<h2>Crypto</h2>' + cards(M.crypto);
Object.keys(M.holders).sort().forEach(function (name) {
  var x = M.holders[name];
  h += '<h2>' + esc(name) + '</h2><div class="holder-sum">Cash ' + money(x.summary.cash, 'PHP') + ' · open ' + money(x.summary.openStakes, 'PHP') +
    (x.summary.maxReturn ? ' · max return ' + money(x.summary.maxReturn, 'PHP') : '') + '</div>' + cards(x.cards);
});
if (M.empty.length) {
  h += '<button onclick="document.getElementById(\'emp\').classList.toggle(\'hidden\')">Show empty (' + M.empty.length + ')</button>' +
    '<div id="emp" class="hidden"><h2>Empty</h2>' + cards(M.empty) + '</div>';
}
h += '</div>';

var Y = M.money, YS = Y.summary;
h += '<div id="p-money" class="hidden"><div class="asof">Settled bets only · open stakes shown separately</div><div class="strip">' +
  stat('Deposits', money(YS.deposits, 'PHP'), 'opening + deposits') +
  stat('Withdrawals', money(YS.withdrawals, 'PHP')) +
  stat('Betting result', sgn(YS.result, 'PHP'), 'settled only') +
  stat('Cash in books', money(YS.cash, 'PHP'), 'same as Books page') + '</div>';
h += '<h2>All my PHP pots</h2><div class="holder-sum">Own books plus every holder · the holders’ money is yours too · before commissions</div><div class="strip">' +
  stat('Deposits', money(Y.all.deposits, 'PHP'), 'opening + deposits') +
  stat('Withdrawals', money(Y.all.withdrawals, 'PHP')) +
  stat('Betting result', sgn(Y.all.result, 'PHP'), 'settled only') +
  stat('Cash in books', money(Y.all.cash, 'PHP')) + '</div>';
h += '<h2>My books</h2>' + mcards(Y.own);
if (Y.crypto.length) h += '<h2>Crypto</h2>' + mcards(Y.crypto);
Object.keys(Y.holders).sort().forEach(function (name) {
  var x = Y.holders[name], u = x.summary;
  h += '<h2>' + esc(name) + '</h2><div class="holder-sum">Deposits ' + money(u.deposits, 'PHP') + ' · withdrawals ' + money(u.withdrawals, 'PHP') +
    ' · cash ' + money(u.cash, 'PHP') + '</div>' + mcards(x.cards);
});
h += '</div>';
h += '<div id="p-months" class="hidden"></div>';
document.getElementById('app').innerHTML = h;

// ---- Months page ----
var MO = (M.months || []).slice().reverse(), potSel = 'All', monthSel = MO.length ? MO[0].key : '';
var POTNAME = {All: 'All my PHP pots', Mine: 'My books'};
function pct(x) { return x === null ? '–' : (x > 0 ? '+' : '') + (x * 100).toFixed(1) + '%'; }
function potOf(m, name) { return name === 'All' ? m.all : m.pots[name]; }
function mrow(k, v) { return '<div class="row"><span>' + k + '</span><span>' + v + '</span></div>'; }
function mpot(name, p) {
  var h = '<div class="card"><div class="name"><span>' + esc(POTNAME[name] || name) + '</span><span>' + sgn(p.net, 'PHP') + '</span></div>';
  if (p.opening != null) h += mrow('Opening', money(p.opening, 'PHP'));
  h += mrow('Deposits', money(p.deposits, 'PHP')) + mrow('Withdrawals', money(p.withdrawals, 'PHP'));
  if (p.transfers) h += mrow('Transfers', sgn(p.transfers, 'PHP'));
  h += mrow('Tickets', p.tickets) + mrow('Staked (settled)', money(p.staked, 'PHP')) +
    mrow('Betting result', sgn(p.result, 'PHP')) + mrow('ROI', pct(p.roi));
  if (p.bonus) h += mrow('Bonus / adj.', sgn(p.bonus, 'PHP'));
  if (p.costs) h += mrow('Costs / commission', money(-p.costs, 'PHP'));
  if (p.open) h += mrow('Still open', money(p.open, 'PHP'));
  h += '<div class="row total"><span>Net</span><span>' + sgn(p.net, 'PHP') + '</span></div>';
  if (p.close) {
    h += '<div class="note">Closed ' + esc(p.close.closedOn) + ' · next month opens at ' + money(p.close.nextOpening, 'PHP') +
      (p.close.note ? ' · ' + esc(p.close.note) : '') + '</div>';
    if (p.drift) h += '<div class="note warn">Changed by ' + signed(p.drift, 'PHP') + ' since the close (a ticket was corrected or added)</div>';
  }
  return h + '</div>';
}
function renderMonths() {
  var names = ['All'];
  MO.forEach(function (m) { Object.keys(m.pots).forEach(function (n) { if (names.indexOf(n) < 0) names.push(n); }); });
  var h = '<div class="asof">Tickets count in the month they were placed · settled bets only · pesos only (crypto apart) · net = result + bonus − costs</div>';
  h += '<div class="chips">' + names.map(function (n) {
    return '<button class="' + (n === potSel ? 'on' : '') + '" onclick="potSel=\'' + esc(n) + '\';renderMonths()">' + esc(POTNAME[n] || n) + '</button>';
  }).join('') + '</div>';
  h += '<div class="tbl"><table><tr><th>Month</th><th>Tickets</th><th>Staked</th><th>Result</th><th>ROI</th><th>Costs</th><th>Net</th></tr>';
  MO.forEach(function (m) {
    var p = potOf(m, potSel);
    h += '<tr class="' + (m.key === monthSel ? 'sel' : '') + '" onclick="monthSel=\'' + m.key + '\';renderMonths()"><td>' + esc(m.label) +
      (p.drift ? ' <span class="warn">⚠</span>' : '') + (p.open ? ' <span class="asof">· open</span>' : '') + '</td><td>' + p.tickets +
      '</td><td>' + money(p.staked, 'PHP') + '</td><td>' + sgn(p.result, 'PHP') + '</td><td>' + pct(p.roi) + '</td><td>' +
      (p.costs ? money(-p.costs, 'PHP') : '–') + '</td><td>' + sgn(p.net, 'PHP') + '</td></tr>';
  });
  h += '</table></div>';
  var m = MO.filter(function (x) { return x.key === monthSel; })[0];
  if (m) {
    h += '<h2>' + esc(m.label) + ' · tap a month above to switch</h2><div class="cards">' + mpot('All', m.all);
    Object.keys(m.pots).forEach(function (n) {
      var p = m.pots[n];
      if (p.tickets || p.deposits || p.withdrawals || p.costs || p.bonus || p.close || p.opening != null) h += mpot(n, p);
    });
    h += '</div>';
  }
  document.getElementById('p-months').innerHTML = h;
}
renderMonths();
</script>
</body>
</html>
